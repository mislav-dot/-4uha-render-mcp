name = "4uha-render-mcp"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "RENDERS"
bucket_name = "4uha-renders"

[vars]
OPENAI_IMAGE_MODEL = "gpt-image-2"
XAI_IMAGE_MODEL = "grok-imagine-image-2.0"

# Tajne (NE upisivati ovdje, nego u Cloudflare: Settings -> Variables and Secrets):
#   OPENAI_API_KEY
#   XAI_API_KEY
#   ACCESS_TOKEN
